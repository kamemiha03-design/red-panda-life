<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eee7">
<title>ぽんずと暮らす | レッサーパンダ育成日記</title>
<style>
:root{--ink:#493a34;--muted:#8b776d;--cream:#fffaf5;--pink:#e9b5a4;--sage:#9eae91;--line:#eadbd0;--gold:#d9ad68}
*{box-sizing:border-box}body{margin:0;background:#f3e9e1;color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
button{font:inherit;cursor:pointer} .app{max-width:1080px;margin:auto;padding:18px 16px 32px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 16px}
h1{font-size:clamp(23px,4vw,34px);margin:0;letter-spacing:.04em}.brand small{color:var(--muted);letter-spacing:.12em}
.day{background:#fff9;border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);gap:16px}
.room{position:relative;min-height:570px;overflow:hidden;border:7px solid #fff9f3;border-radius:25px;background:linear-gradient(#dce8e4 0 48%,#d9c4ad 48% 50%,#c6a78e 50%);box-shadow:0 12px 32px #72523b18}
.wall{position:absolute;inset:0 0 50% 0;background:linear-gradient(90deg,#f2dfd2,#f8e9df 50%,#f0ddd0)}
.window{position:absolute;top:9%;left:8%;width:31%;height:29%;border:9px solid #fff8ed;border-radius:5px;background:linear-gradient(#b8d4d3 0 60%,#d8e5c9 60%);box-shadow:0 3px 8px #755b4820}
.window:before,.window:after{content:"";position:absolute;background:#fff8ed}.window:before{width:6px;top:0;bottom:0;left:50%}.window:after{height:6px;left:0;right:0;top:55%}
.curtain{position:absolute;top:7%;left:5%;width:37%;height:33%;border-left:12px solid #d7a99c;border-right:12px solid #d7a99c;opacity:.8}
.shelf{position:absolute;right:7%;top:12%;width:30%;height:18%;border-top:8px solid #a77e60;background:linear-gradient(90deg,transparent 0 5%,#d2b89f 5% 29%,transparent 29% 36%,#d2b89f 36% 62%,transparent 62% 69%,#d2b89f 69% 95%,transparent 95%);filter:drop-shadow(0 5px 2px #755b4820)}
.plant{position:absolute;left:7%;bottom:17%;width:62px;height:105px}.plant:before{content:"";position:absolute;bottom:0;left:10px;width:44px;height:42px;background:#bd8d70;border-radius:5px 5px 15px 15px}.plant:after{content:"";position:absolute;left:28px;top:4px;width:9px;height:65px;background:#78916e;transform:rotate(-7deg);box-shadow:-20px 19px 0 -2px #78916e,19px 28px 0 -2px #78916e}
.sofa{position:absolute;right:5%;bottom:17%;width:35%;height:105px;background:#b78e7b;border-radius:25px 25px 13px 13px;box-shadow:inset 0 -12px #a77e6b}
.sofa:before{content:"";position:absolute;left:-10px;right:-10px;bottom:0;height:45px;background:#c69f8d;border-radius:12px;z-index:-1}
.rug{position:absolute;left:24%;right:17%;bottom:5%;height:110px;background:#e8d5c1;border-radius:50%;opacity:.95}
.floorline{position:absolute;left:0;right:0;bottom:0;height:16%;background:repeating-linear-gradient(90deg,#b99578 0 2px,#c5a486 2px 110px)}
.pet{position:absolute;left:50%;bottom:17%;width:210px;height:245px;transform:translateX(-50%);display:grid;place-items:center;transition:transform .3s}
.pet svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 5px #5b3b3025)}
.pet.bounce{animation:bounce .45s ease}.pet.sleeping{transform:translateX(-50%) rotate(-8deg);filter:saturate(.7)}
@keyframes bounce{50%{transform:translate(-50%,-15px) rotate(4deg)}}
.speech{position:absolute;top:8%;right:6%;max-width:190px;background:#fffdf8;border:1px solid var(--line);padding:10px 14px;border-radius:18px;font-size:13px;box-shadow:0 5px 16px #65452c16}
.speech:after{content:"";position:absolute;left:24px;bottom:-8px;width:14px;height:14px;background:#fffdf8;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.side{display:flex;flex-direction:column;gap:13px}.panel{background:#fffaf5;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 7px 20px #72523b0c}
.petname{display:flex;justify-content:space-between;align-items:center}.petname h2{font-size:21px;margin:0}.stage{font-size:11px;background:#f3e4d8;border-radius:99px;padding:6px 10px;color:#856d5e}
.stats{display:grid;gap:12px;margin-top:14px}.stat{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:12px}.track{height:10px;border-radius:99px;background:#eee5dc;overflow:hidden}.fill{height:100%;width:70%;border-radius:99px;background:var(--sage);transition:width .35s}.stat:nth-child(1) .fill{background:#e5b46f}.stat:nth-child(2) .fill{background:#e5a6a1}.stat:nth-child(3) .fill{background:#a4b895}.stat:nth-child(4) .fill{background:#9db5c4}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.action{border:1px solid var(--line);background:#fffdf9;border-radius:15px;padding:11px 5px;color:var(--ink);font-size:12px;transition:.15s}.action:active{transform:scale(.96);background:#f6e9df}.action span{display:block;font-size:23px;margin-bottom:4px}
.growth-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.growthbar{height:9px;background:#eee5dc;border-radius:99px;overflow:hidden}.growthbar div{height:100%;background:linear-gradient(90deg,#d9b27b,#e7a79a);width:0%;transition:width .3s}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin:9px 0 0}.log{font-size:12px;color:var(--muted);line-height:1.7;min-height:38px}
footer{text-align:center;color:#9c897d;font-size:11px;margin:17px 0 0}
@media(max-width:760px){.layout{grid-template-columns:1fr}.room{min-height:470px}.pet{width:185px;height:220px;bottom:16%}.speech{max-width:155px;font-size:12px}.side{display:grid;grid-template-columns:1fr}.app{padding:13px 11px 24px}}
@media(max-width:390px){.room{min-height:420px}.pet{width:160px;height:200px}.actions{gap:6px}.action{font-size:11px}}

/* --- detailed room illustration upgrade --- */
.wall{background-color:#f5e6dc;background-image:radial-gradient(#dfc8b9 1px,transparent 1.4px),linear-gradient(90deg,#f2dfd2,#faeee6 52%,#f0ddd0);background-size:19px 19px,100% 100%}
.wall:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 49.5%,#e8d3c5 50%,transparent 50.5%);opacity:.35}
.window{box-shadow:inset 0 0 0 3px #d4bba6,0 7px 15px #755b4828;background:linear-gradient(#a9cbd0 0 48%,#d7e6d0 49% 63%,#a7bd91 64% 70%,#d8e4c8 71%);overflow:hidden}
.window:before{z-index:2;box-shadow:0 0 0 2px #fff8ed}.window:after{z-index:2}
.curtain{background:repeating-linear-gradient(90deg,#d7a99c 0 8px,#e8c2b4 8px 15px);border:0;box-shadow:inset 5px 0 #c58f82,inset -5px 0 #c58f82;clip-path:polygon(0 0,100% 0,94% 100%,6% 100%)}
.shelf{height:19%;background:linear-gradient(#a77e60 0 8px,transparent 8px),repeating-linear-gradient(90deg,transparent 0 7%,#c99c7b 7% 10%,#e6cdb5 10% 12%,transparent 12% 17%);border-top-color:#916a50}
.shelf:before{content:"";position:absolute;top:-28px;left:7%;width:22%;height:26px;background:repeating-linear-gradient(90deg,#a8b59a 0 8px,#d7b47d 8px 15px,#c58b7d 15px 22px);border-radius:3px 3px 0 0}
.shelf:after{content:"";position:absolute;right:7%;top:-24px;width:28px;height:24px;border-radius:50% 50% 4px 4px;background:#a9b998;box-shadow:0 6px 0 -2px #c5a486}
.plant:after{width:9px;box-shadow:-20px 19px 0 -2px #78916e,19px 28px 0 -2px #78916e,-10px 42px 0 -2px #78916e,15px 5px 0 -2px #78916e}
.sofa{background:linear-gradient(180deg,#c79d89,#b78e7b 55%,#a77e6b);box-shadow:inset 0 8px #d8b4a2,inset 0 -12px #a77e6b,0 9px 14px #6c493022}
.sofa:after{content:"";position:absolute;left:12%;top:14px;width:34%;height:48px;border-radius:13px;background:#d8b4a2;box-shadow:inset 0 -4px #c29280,75px 0 0 -1px #e1c1ae,75px 4px 0 -1px #c29280}
.rug{background:repeating-radial-gradient(ellipse at center,#eadbc9 0 8px,#dfcbb7 9px 11px);border:2px solid #d5bda7;box-shadow:0 5px 9px #765b3d18}
.floorline{background:repeating-linear-gradient(90deg,#b99578 0 2px,#c5a486 2px 110px),linear-gradient(#c5a486,#b99578)}
.floorline:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,#a98568 32px,#a98568 33px,transparent 34px);opacity:.45}
.room:after{content:"";position:absolute;left:43%;top:8%;width:76px;height:92px;border:7px solid #c49b7e;background:linear-gradient(#f7e9d9,#d9e5d3);box-shadow:inset 0 0 0 3px #fff6eb,0 5px 12px #79583a18;z-index:0}
.room{isolation:isolate}
.wall,.window,.curtain,.shelf,.plant,.sofa,.rug,.floorline{z-index:0}
.speech{z-index:5}
.pet{z-index:3}
.room .decor-side{position:absolute;right:41%;bottom:16%;width:62px;height:55px;background:linear-gradient(#c59b78 0 12%,#a77c5c 13% 100%);border-radius:8px 8px 4px 4px;z-index:2;box-shadow:0 8px 10px #64432a20}
.room .decor-side:before{content:"";position:absolute;top:-26px;left:14px;width:34px;height:27px;border-radius:50% 50% 35% 35%;background:#e6b7a0;box-shadow:inset 0 -5px #d49b87}
.room .decor-lamp{position:absolute;left:43%;top:23%;width:38px;height:70px;z-index:1}
.room .decor-lamp:before{content:"";position:absolute;left:5px;top:0;width:30px;height:24px;background:#e8c99b;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);filter:drop-shadow(0 2px 2px #765b4825)}
.room .decor-lamp:after{content:"";position:absolute;left:18px;top:23px;width:3px;height:43px;background:#9e8066;box-shadow:-10px 43px 0 3px #9e8066,10px 43px 0 3px #9e8066}
.room .decor-basket{position:absolute;left:17%;bottom:12%;width:42px;height:35px;background:repeating-linear-gradient(90deg,#c69d76 0 5px,#d9b48d 5px 9px);border-radius:5px 5px 12px 12px;z-index:2}
.room .decor-basket:before{content:"";position:absolute;left:8px;top:-9px;width:24px;height:14px;border:4px solid #b78e6b;border-bottom:0;border-radius:14px 14px 0 0}
.pet svg{filter:drop-shadow(0 10px 6px #5b3b3030)}
@media(max-width:760px){.room:after{width:55px;height:68px;left:43%}}
</style>
</head>
<body>
<div class="app">

<aside class="side">
<section class="panel">
<div class="petname"><h2>ぽんず</h2><span class="stage" id="stage">赤ちゃん</span></div>

<script>
const initial={hunger:72,mood:76,clean:85,energy:80,growth:0,day:1};
let s={...initial};try{const saved=JSON.parse(localStorage.getItem('ponzu-save'));if(saved)s={...s,...saved}}catch(e){}
const $=id=>document.getElementById(id);
const stages=['赤ちゃん','こども','若者','おとな'];
const lines={feed:'もぐもぐ……おいしい！',play:'わーい！そのおもちゃ大好き！',pet:'えへへ、そこ気持ちいいな。',clean:'お部屋がぴかぴか！すっきりしたよ。',sleep:'すやすや……ちょっと休憩。',talk:'あなたと一緒にいると安心するよ。'};
function stageIndex(){return Math.min(3,Math.floor(s.growth/100))}
function render(){['hunger','mood','clean','energy'].forEach(k=>{$(k).style.width=s[k]+'%';$(k+'N').textContent=s[k]});$('growth').style.width=(s.growth%100)+'%';$('growthText').textContent=(s.growth%100)+' / 100';$('stage').textContent=stages[stageIndex()];$('day').textContent='☀ '+s.day+'日目';$('growthNote').textContent=stageIndex()===3?'立派なおとなになったよ！これからも一緒に過ごそう。':'次の成長まであと '+(100-s.growth%100)+' ポイント。毎日のお世話が力になるよ。';localStorage.setItem('ponzu-save',JSON.stringify(s))}
function act(a){let msg=lines[a];const p=$('pet');p.classList.remove('bounce','sleeping');void p.offsetWidth;
if(a==='feed'){s.hunger=Math.min(100,s.hunger+24);s.mood=Math.min(100,s.mood+5);s.clean=Math.max(0,s.clean-2)}
if(a==='play'){if(s.energy<15){msg='ちょっと眠たいみたい。先に休ませてあげよう。'}else{s.mood=Math.min(100,s.mood+18);s.energy=Math.max(0,s.energy-15);s.hunger=Math.max(0,s.hunger-7)}}
if(a==='pet'){s.mood=Math.min(100,s.mood+13);s.energy=Math.min(100,s.energy+3)}
if(a==='clean'){s.clean=100;s.mood=Math.min(100,s.mood+4)}
if(a==='sleep'){s.energy=100;s.hunger=Math.max(0,s.hunger-5);p.classList.add('sleeping')}
if(a==='talk'){s.mood=Math.min(100,s.mood+8)}
if(a!=='sleep')p.classList.add('bounce');
if(msg===lines[a]){let before=stageIndex();s.growth=Math.min(300,s.growth+12);if(stageIndex()>before)msg='やった！ぽんずが「'+stages[stageIndex()]+'」に成長したよ！';}
$('speech').textContent=msg;$('log').textContent='「'+({feed:'ごはん',play:'あそび',pet:'なでなで',clean:'おそうじ',sleep:'おひるね',talk:'おはなし'}[a])+'」をしたよ。'+msg;render()}
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));
setInterval(()=>{s.hunger=Math.max(0,s.hunger-1);s.energy=Math.max(0,s.energy-0.4);s.clean=Math.max(0,s.clean-0.25);render()},60000);
render();
</script>
</body></html>
