<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7eee5">
<title>まいにち、レッサー。</title>
<style>
:root{--ink:#49382f;--cream:#fff9f1;--peach:#e9a17c;--green:#91a78c;--line:#ead9ca}
*{box-sizing:border-box}body{margin:0;background:#f4e9dc;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
main{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.top h1{font-size:clamp(22px,5vw,34px);margin:0}.sub{font-size:12px;color:#927d6e}
.room{position:relative;min-height:390px;overflow:hidden;border:8px solid #fffaf4;border-radius:24px;background:linear-gradient(#f8e7d6 0 68%,#b98b6d 68%);box-shadow:0 8px 25px #78553a22}
.window{position:absolute;left:7%;top:9%;width:26%;height:38%;background:linear-gradient(#b9d7dc,#f5e6c9);border:9px solid #fff8ed;border-radius:8px;box-shadow:inset 0 0 0 3px #c8a98d}
.window:before,.window:after{content:"";position:absolute;background:#fff8ed}.window:before{width:7px;height:100%;left:50%}.window:after{height:7px;width:100%;top:50%}
.curtain{position:absolute;top:6%;left:5%;width:30%;height:42%;border-left:14px solid #d8a58c;border-right:14px solid #d8a58c;pointer-events:none}
.shelf{position:absolute;right:7%;top:14%;width:24%;height:13%;border-bottom:12px solid #9a684b;background:linear-gradient(90deg,transparent 0 8%,#c77d57 8% 19%,transparent 19% 27%,#8b9e7c 27% 39%,transparent 39% 48%,#d7b16c 48% 61%,transparent 61% 70%,#bd816b 70% 82%,transparent 82%);filter:drop-shadow(0 4px 2px #76523b22)}
.plant{position:absolute;bottom:29%;right:8%;font-size:52px}.rug{position:absolute;bottom:3%;left:26%;width:48%;height:22%;border-radius:50%;background:#d8b9a1;opacity:.75}
.sofa{position:absolute;bottom:17%;left:5%;width:28%;height:22%;border-radius:22px 22px 12px 12px;background:#82947c;box-shadow:inset 0 -12px #667b68}
.sofa:before{content:"";position:absolute;left:-7px;right:-7px;bottom:-8px;height:18px;border-radius:10px;background:#657966}
.pillow{position:absolute;left:20%;top:15%;width:26%;height:44%;border-radius:9px;background:#e7c29f}
.desk{position:absolute;right:5%;bottom:18%;width:27%;height:9%;background:#9c6b4b;border-radius:5px}.desk:after{content:"";position:absolute;left:12%;right:12%;top:100%;height:45px;border-left:7px solid #80553d;border-right:7px solid #80553d}
.laptop{position:absolute;right:12%;bottom:28%;width:12%;height:10%;border:5px solid #6e7776;border-bottom-width:8px;background:#b8d3d1;border-radius:4px}
.pet{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:190px;height:190px;display:grid;place-items:center;filter:drop-shadow(0 7px 4px #51311d22);transition:transform .25s}
.pet.bounce{transform:translateX(-50%) translateY(-12px) rotate(-3deg)}
svg{width:100%;height:100%;overflow:visible}.speech{position:absolute;left:50%;bottom:88%;transform:translateX(-50%);background:#fffaf4;border-radius:18px;padding:8px 13px;font-size:13px;white-space:nowrap;box-shadow:0 3px 12px #49382f22;opacity:0;transition:opacity .2s}.speech.show{opacity:1}
.panel{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.card{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 5px 15px #76553a0c}.card h2{font-size:17px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{font-size:13px}.statline{display:flex;justify-content:space-between;margin-bottom:5px}.bar{height:9px;background:#eee1d5;border-radius:20px;overflow:hidden}.fill{height:100%;border-radius:20px;background:var(--green);transition:width .3s}.fill.low{background:#d88d72}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{border:1px solid #e6d2c1;background:#fffdf9;border-radius:14px;padding:12px 5px;color:var(--ink);font-weight:650;font-size:13px;cursor:pointer;transition:.15s}.actions button:active{transform:scale(.96);background:#f8e8da}.actions span{display:block;font-size:22px;margin-bottom:4px}
.progress{margin-top:13px;font-size:13px}.progress .bar{height:11px;margin-top:6px}.log{font-size:13px;line-height:1.7;color:#816e60;min-height:48px}.name{border:0;border-bottom:1px dashed #c8a98d;background:transparent;color:var(--ink);font:inherit;font-weight:700;width:110px}
@media(max-width:650px){main{padding:12px}.room{min-height:340px}.pet{width:160px;height:160px}.panel{grid-template-columns:1fr}.sofa{width:34%}.desk{width:30%}.plant{font-size:42px}.actions button{padding:10px 2px}}
</style>
</head>
<body>
<main>
<header class="top"><div><h1>まいにち、レッサー。</h1><div class="sub">小さな同居人との、のんびり暮らし。</div></div><div class="sub">おへやで育てる育成ゲーム</div></header>
<section class="room" aria-label="レッサーパンダのお部屋">
<div class="window"></div><div class="curtain"></div><div class="shelf"></div><div class="plant">🪴</div><div class="sofa"><div class="pillow"></div></div><div class="desk"></div><div class="laptop"></div><div class="rug"></div>
<div class="pet" id="pet">
<div class="speech" id="speech">おなかすいたな…</div>
<svg viewBox="0 0 220 220" role="img" aria-label="かわいいレッサーパンダ">
<defs><linearGradient id="fur" x2="0" y2="1"><stop stop-color="#c8794f"/><stop offset="1" stop-color="#8f4934"/></linearGradient><linearGradient id="cream" x2="0" y2="1"><stop stop-color="#fff0d9"/><stop offset="1" stop-color="#e8c9a6"/></linearGradient></defs>
<path d="M153 151 Q205 175 195 124 Q190 103 171 117 Q204 94 213 122 Q228 166 177 181 Q151 189 137 169" fill="url(#fur)" stroke="#75402f" stroke-width="4"/>
<path d="M170 151 Q197 157 205 132 M157 164 Q185 177 202 153" fill="none" stroke="#f1c18c" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="108" cy="160" rx="57" ry="45" fill="url(#fur)"/>
<ellipse cx="108" cy="174" rx="35" ry="27" fill="url(#cream)"/>
<path d="M63 79 L58 28 Q57 17 70 27 L94 52 M128 52 L153 27 Q166 17 164 33 L154 84" fill="#9e5238" stroke="#713b2d" stroke-width="5"/>
<path d="M67 39 L83 57 L68 59Z M154 39 L138 58 L154 59Z" fill="#e9b5a0"/>
<ellipse cx="109" cy="91" rx="58" ry="55" fill="url(#fur)"/>
<path d="M61 84 Q73 58 91 71 Q100 82 91 103 Q80 121 61 111 Q48 101 61 84Z" fill="url(#cream)"/>
<path d="M157 84 Q145 58 127 71 Q118 82 127 103 Q138 121 157 111 Q170 101 157 84Z" fill="url(#cream)"/>
<path d="M78 83 Q87 73 96 86 M122 86 Q132 73 141 83" fill="none" stroke="#f8e8ce" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="91" cy="91" rx="5" ry="7" fill="#30241f"/><ellipse cx="128" cy="91" rx="5" ry="7" fill="#30241f"/>
<ellipse cx="109" cy="111" rx="25" ry="18" fill="url(#cream)"/><path d="M102 107 Q109 99 116 107 Q114 115 109 115 Q104 115 102 107Z" fill="#49312b"/>
<path d="M109 115 Q108 124 100 124 M109 115 Q110 124 118 124" fill="none" stroke="#6e4939" stroke-width="2" stroke-linecap="round"/>
<path d="M74 135 Q109 147 144 135" fill="none" stroke="#7b4431" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="83" cy="190" rx="17" ry="8" fill="#6e4031"/><ellipse cx="135" cy="190" rx="17" ry="8" fill="#6e4031"/>
</svg></div>
</section>
<section class="panel">
<div class="card"><h2>🐾 <input class="name" id="petName" value="ぽんず" maxlength="8" aria-label="名前"> のようす</h2><div class="stats" id="stats"></div><div class="progress"><div class="statline"><b id="stage">赤ちゃん</b><span id="xpText">成長 0 / 100</span></div><div class="bar"><div class="fill" id="xpBar" style="width:0%"></div></div></div></div>
<div class="card"><h2>いっしょに過ごそう</h2><div class="actions">
<button data-action="feed"><span>🍎</span>ごはん</button><button data-action="play"><span>🧶</span>あそぶ</button><button data-action="pet"><span>🤎</span>なでる</button><button data-action="clean"><span>🧹</span>おそうじ</button><button data-action="nap"><span>💤</span>おひるね</button><button data-action="talk"><span>💬</span>おはなし</button>
</div></div>
<div class="card" style="grid-column:1/-1"><h2>📖 きょうの記録</h2><div class="log" id="log">ぽんずがあなたのお部屋にやってきた！まずは仲良くなろう。</div></div>
</section>
</main>
<script>
const state={hunger:76,mood:72,clean:88,energy:80,xp:0,stage:0};
const labels={hunger:"おなか",mood:"ごきげん",clean:"きれい",energy:"元気"};
const stages=["赤ちゃん","こども","若者","おとな"];
const stats=document.getElementById("stats"),log=document.getElementById("log"),speech=document.getElementById("speech"),pet=document.getElementById("pet");
function render(){stats.innerHTML=Object.keys(labels).map(k=>'<div class="stat"><div class="statline"><span>'+labels[k]+'</span><b>'+state[k]+'%</b></div><div class="bar"><div class="fill '+(state[k]<30?'low':'')+'" style="width:'+state[k]+'%"></div></div></div>').join('');document.getElementById("stage").textContent=stages[state.stage];document.getElementById("xpText").textContent='成長 '+state.xp+' / 100';document.getElementById("xpBar").style.width=state.xp+'%'}
const actions={
feed:{text:"おいしそうにごはんを食べている！",say:"むしゃむしゃ！",change:{hunger:24,mood:5,energy:3}},
play:{text:"おもちゃを追いかけて夢中で遊んだ！",say:"まてまて〜！",change:{mood:20,energy:-17,hunger:-8}},
pet:{text:"やさしくなでたら、うれしそうに目を細めた。",say:"そこ、きもちいい…",change:{mood:16,energy:4}},
clean:{text:"お部屋をきれいにした。ぽんずも快適そう！",say:"すっきり！",change:{clean:28,mood:5}},
nap:{text:"ふかふかのラグでお昼寝。元気が戻った！",say:"すやすや…",change:{energy:27,hunger:-7,mood:5}},
talk:{text:"今日あったことを話した。じっと聞いてくれた。",say:"うんうん！",change:{mood:12}}
};
document.querySelectorAll("button[data-action]").forEach(b=>b.addEventListener("click",()=>{const a=actions[b.dataset.action];for(const [k,v] of Object.entries(a.change))state[k]=Math.max(0,Math.min(100,state[k]+v));state.xp=Math.min(100,state.xp+12);if(state.xp===100&&state.stage<3){state.stage++;state.xp=0;log.textContent='🎉 '+stages[state.stage]+'に成長した！少しずつ大人になっていくね。';}else log.textContent=a.text; speech.textContent=a.say;speech.classList.add("show");pet.classList.add("bounce");setTimeout(()=>{speech.classList.remove("show");pet.classList.remove("bounce")},1100);render()}));
document.getElementById("petName").addEventListener("input",e=>{document.title=e.target.value+"と、まいにち。"});
render();
</script>
</body>
</html>
